<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Stylized Supercar Silhouette / Speedlines -->
  <path d="M 12 38 L 18 28 L 30 22 L 44 22 L 52 28 L 56 38 Z" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Cockpit glass dome -->
  <path d="M 24 28 L 30 24 L 40 24 L 44 28 Z" fill="url(#neonCyan)" opacity="0.6" />
  
  <!-- Racing wheels -->
  <circle cx="20" cy="38" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
  <circle cx="20" cy="38" r="2" fill="#f8fafc" />
  <circle cx="48" cy="38" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
  <circle cx="48" cy="38" r="2" fill="#f8fafc" />

  <!-- Speed trails -->
  <line x1="8" y1="44" x2="56" y2="44" stroke="url(#amberGold)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="48" x2="38" y2="48" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
